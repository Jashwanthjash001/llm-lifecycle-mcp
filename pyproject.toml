[project]
name = "llm-lifecycle-mcp"
version = "0.1.0"
description = "MCP server to operate a local-LLM lifecycle: quantize, evaluate, serve, and RAG."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
llm-lifecycle-mcp = "llm_lifecycle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lifecycle_mcp"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
